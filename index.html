<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhật Ký Của Tôi - Mochi Edition</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f0f4f8">
    
    <!-- Icon ứng dụng khi Thêm vào Màn hình chính -->
    <link rel="apple-touch-icon" sizes="180x180" href="nen.jpg">
    <link rel="icon" type="image/jpeg" sizes="32x32" href="nen.jpg">
    <link rel="shortcut icon" href="nen.jpg">
    <meta name="apple-mobile-web-app-title" content="Nhật Ký Mochi">

    <!-- RemixIcon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Google Fonts: Font viết tay hỗ trợ Tiếng Việt & Tiếng Trung Giản Thể -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #eef4f8;
            color: #333;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            background-color: #f7f9fc;
            min-height: 100vh;
            padding: 16px 16px 90px 16px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
        }

        /* Banner Quote Nhắc Nhở */
        .quote-banner {
            background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%);
            border: 1px solid #bae6fd;
            border-radius: 16px;
            padding: 10px 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.08);
        }

        .quote-banner i {
            font-size: 20px;
            color: #0284c7;
            flex-shrink: 0;
        }

        .quote-banner p {
            font-size: 13px;
            font-weight: 600;
            color: #0369a1;
            line-height: 1.3;
        }

        /* Header Chuyển Ngày Lịch */
        .date-navigator {
            background: #ffffff;
            border-radius: 20px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 16px;
        }

        .date-nav-btn {
            background: #f1f5f9;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #334155;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .date-nav-btn:active {
            background: #cbd5e1;
            transform: scale(0.92);
        }

        .date-display-box {
            text-align: center;
            position: relative;
            cursor: pointer;
        }

        .date-display-text {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
        }

        .date-picker-hidden {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Bộ sưu tập ảnh trong ngày */
        .daily-gallery-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .daily-gallery-title {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .daily-gallery-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .daily-gallery-scroll::-webkit-scrollbar { display: none; }

        .daily-gallery-img {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            cursor: pointer;
        }

        /* Tab Content */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Timeline Nhật Ký Ngắn */
        .timeline {
            position: relative;
            padding-left: 105px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 72px;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background-color: #cbd5e1;
            z-index: 1;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 28px;
            display: flex;
            align-items: flex-start;
            min-height: 36px;
        }

        .timeline-time {
            position: absolute;
            left: -105px;
            top: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            width: 50px;
            text-align: right;
        }

        .timeline-icon-box {
            position: absolute;
            left: -51px;
            top: -2px;
            z-index: 2;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f9fc;
        }

        .timeline-icon-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .timeline-content {
            background: transparent;
            padding: 4px 0 0 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .timeline-body-row {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            justify-content: space-between;
        }

        .timeline-text {
            font-size: 14px;
            color: #334155;
            line-height: 1.5;
            flex: 1;
            word-break: break-word;
        }

        .timeline-img {
            width: 90px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
            align-self: flex-start;
            padding: 2px 0;
        }
        .delete-btn:hover { color: #ef4444; }

        /* Form Nhập */
        .form-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
        }

        .form-card h4 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .mood-selector {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding: 6px 4px;
            scrollbar-width: none;
            align-items: center;
        }
        .mood-selector::-webkit-scrollbar { display: none; }

        .mood-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .mood-icon-bg {
            width: 48px;
            height: 48px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .mood-icon-bg img { width: 100%; height: 100%; object-fit: contain; }
        .mood-label { font-size: 11px; color: #64748b; font-weight: 500; }
        .mood-item.selected .mood-icon-bg { transform: scale(1.25); }
        .mood-item.selected .mood-label { color: #2563eb; font-weight: 700; }

        .form-card textarea {
            width: 100%;
            height: 75px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            font-size: 14px;
            resize: none;
            outline: none;
            background: #f8fafc;
            margin-bottom: 10px;
        }

        .form-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .file-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #475569;
            font-weight: 500;
        }

        .file-btn i { font-size: 15px; color: #3b82f6; }

        .submit-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-left: auto;
        }

        #imagePreview, #longImagePreview {
            max-width: 100%;
            max-height: 100px;
            border-radius: 8px;
            display: none;
            margin-top: 8px;
        }

        input[type="file"] { display: none; }

        /* MỤC "ME" - NHẬT KÝ DÀI TRANG GIẤY THẬT */
        .me-header-btn {
            background: linear-gradient(135deg, #a7f3d0 0%, #6ee7b7 100%);
            border: none;
            border-radius: 18px;
            padding: 16px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #065f46;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(110, 231, 183, 0.3);
            margin-bottom: 20px;
        }

        .me-header-btn i { font-size: 24px; }

        /* Màn hình Trang Giấy Nhật Ký Dài (Modal Sheet) */
        .paper-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .paper-modal.active { display: flex; }

        .paper-container {
            width: 100%;
            max-width: 420px;
            height: 90vh;
            background: #fdfbf7;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid #f3e8d5;
        }

        .paper-header {
            padding: 14px 18px;
            background: #f7f1e3;
            border-bottom: 1px solid #e6d7bc;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .paper-header h3 {
            font-size: 15px;
            color: #78350f;
            font-weight: 700;
        }

        .paper-close-btn {
            background: none;
            border: none;
            font-size: 22px;
            color: #78350f;
            cursor: pointer;
        }

        /* Thân trang giấy với dòng kẻ notebook */
        .paper-body {
            flex: 1;
            padding: 20px 20px 20px 45px;
            overflow-y: auto;
            position: relative;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 100% 32px;
            line-height: 32px;
        }

        .paper-body::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 35px;
            width: 1px;
            background: #fca5a5;
        }

        .paper-title-input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
            font-family: 'Caveat', 'Ma Shan Zheng', 'Noto Serif SC', cursive, serif;
            line-height: 32px;
            margin-bottom: 0;
        }

        .paper-content-textarea {
            width: 100%;
            min-height: 300px;
            border: none;
            background: transparent;
            outline: none;
            resize: none;
            font-size: 18px;
            color: #334155;
            font-family: 'Caveat', 'Ma Shan Zheng', 'Noto Serif SC', cursive, serif;
            line-height: 32px;
        }

        .paper-footer {
            padding: 12px 18px;
            background: #f7f1e3;
            border-top: 1px solid #e6d7bc;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Danh sách bài viết dài đã lưu trong Tab Me */
        .long-entry-card {
            background: #fdfbf7;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid #f3e8d5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            position: relative;
        }

        .long-entry-date {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .long-entry-title {
            font-size: 18px;
            font-weight: bold;
            color: #78350f;
            font-family: 'Caveat', 'Ma Shan Zheng', 'Noto Serif SC', cursive, serif;
            margin-bottom: 6px;
        }

        .long-entry-text {
            font-size: 16px;
            color: #475569;
            font-family: 'Caveat', 'Ma Shan Zheng', 'Noto Serif SC', cursive, serif;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* MÀN HÌNH PHÓNG TO ẢNH (IMAGE LIGHTBOX MODAL) */
        .lightbox-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 300;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox-modal.active { display: flex; }

        .lightbox-img-wrapper {
            position: relative;
            max-width: 100%;
            max-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            object-fit: contain;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        /* Thanh công cụ phía trên ảnh phóng to */
        .lightbox-toolbar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 310;
        }

        .lightbox-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #ffffff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .lightbox-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0 20px 0;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
            gap: 4px;
        }

        .nav-item i { font-size: 22px; }
        .nav-item.active { color: #3b82f6; font-weight: 600; }

        .floating-add-btn {
            background: #60a5fa;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            border: none;
            box-shadow: 0 4px 12px rgba(96, 165, 250, 0.4);
            margin-top: -25px;
            cursor: pointer;
        }

        .empty-notice {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            padding: 30px 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- QUOTE NHẮC NHỞ UỐNG NƯỚC -->
    <div class="quote-banner">
        <i class="ri-drop-line"></i>
        <p>Nhắc nhở nhỏ: Hãy uống đủ 2 lít nước mỗi ngày nhé! 💧</p>
    </div>

    <!-- CỤM CHUYỂN NGÀY VÀ XEM LỊCH (Trang chủ) -->
    <div class="date-navigator">
        <button class="date-nav-btn" onclick="navigateDate(-1)"><i class="ri-arrow-left-s-line"></i></button>
        <div class="date-display-box">
            <span class="date-display-text" id="dateDisplayText">Đang tải ngày...</span>
            <input type="date" id="datePicker" class="date-picker-hidden" onchange="onDatePickerChange(this.value)">
        </div>
        <button class="date-nav-btn" onclick="navigateDate(1)"><i class="ri-arrow-right-s-line"></i></button>
    </div>

    <!-- TAB 1: TRANG CHỦ (HOME) -->
    <div id="tab-home" class="tab-content active">
        
        <!-- Album bộ sưu tập ảnh đã up trong ngày -->
        <div class="daily-gallery-card" id="dailyGalleryCard" style="display: none;">
            <div class="daily-gallery-title"><i class="ri-image-line"></i> Ảnh trong ngày:</div>
            <div class="daily-gallery-scroll" id="dailyGalleryScroll"></div>
        </div>

        <div class="timeline" id="timelineList"></div>

        <div class="form-card">
            <h4>Chọn cảm xúc hôm nay:</h4>
            
            <div class="mood-selector" id="moodSelector">
                <div class="mood-item selected" onclick="selectMood('binhthuong.png', 'Bình thường', this)">
                    <div class="mood-icon-bg"><img src="binhthuong.png" alt="Bình thường"></div>
                    <span class="mood-label">Bình thường</span>
                </div>
                <div class="mood-item" onclick="selectMood('yêu.png', 'Yêu đời', this)">
                    <div class="mood-icon-bg"><img src="yêu.png" alt="Yêu đời"></div>
                    <span class="mood-label">Yêu đời</span>
                </div>
                <div class="mood-item" onclick="selectMood('vuive.png', 'Vui vẻ', this)">
                    <div class="mood-icon-bg"><img src="vuive.png" alt="Vui vẻ"></div>
                    <span class="mood-label">Vui vẻ</span>
                </div>
                <div class="mood-item" onclick="selectMood('ngờ.png', 'Bất ngờ', this)">
                    <div class="mood-icon-bg"><img src="ngờ.png" alt="Bất ngờ"></div>
                    <span class="mood-label">Bất ngờ</span>
                </div>
                <div class="mood-item" onclick="selectMood('tinhnghich.png', 'Tinh nghịch', this)">
                    <div class="mood-icon-bg"><img src="tinhnghich.png" alt="Tinh nghịch"></div>
                    <span class="mood-label">Tinh nghịch</span>
                </div>
                <div class="mood-item" onclick="selectMood('ngủ.png', 'Buồn ngủ', this)">
                    <div class="mood-icon-bg"><img src="ngủ.png" alt="Buồn ngủ"></div>
                    <span class="mood-label">Buồn ngủ</span>
                </div>
                <div class="mood-item" onclick="selectMood('tức.png', 'Tức giận', this)">
                    <div class="mood-icon-bg"><img src="tức.png" alt="Tức giận"></div>
                    <span class="mood-label">Tức giận</span>
                </div>
                <div class="mood-item" onclick="selectMood('khoc.png', 'Khóc', this)">
                    <div class="mood-icon-bg"><img src="khoc.png" alt="Khóc"></div>
                    <span class="mood-label">Khóc</span>
                </div>
            </div>

            <textarea id="diaryInput" placeholder="Nhập suy nghĩ của bạn..."></textarea>
            
            <img id="imagePreview" alt="Xem trước ảnh">

            <div class="form-actions">
                <label class="file-btn">
                    <i class="ri-image-add-line"></i> Tải ảnh
                    <input type="file" id="uploadInput" accept="image/*" onchange="handleImageSelect(event, 'preview')">
                </label>
                <label class="file-btn">
                    <i class="ri-camera-line"></i> Chụp ảnh
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleImageSelect(event, 'preview')">
                </label>
                <button class="submit-btn" onclick="saveEntry()">Đăng bài</button>
            </div>
        </div>
    </div>

    <!-- TAB 2: TẤT CẢ NHẬT KÝ (JOURNAL) -->
    <div id="tab-journal" class="tab-content">
        <h3 style="margin-bottom: 15px; color: #1e293b;">📖 Tất cả dòng trạng thái</h3>
        <div id="allEntriesList"></div>
    </div>

    <!-- TAB 3: THỐNG KÊ (STATS) -->
    <div id="tab-stats" class="tab-content">
        <h3 style="margin-bottom: 15px; color: #1e293b;">📊 Thống kê hoạt động</h3>
        <div class="form-card" style="text-align: center;">
            <p style="font-size: 15px; color: #475569;" id="totalCountText">Tổng số bài viết:</p>
        </div>
    </div>

    <!-- TAB 4: CÁ NHÂN (ME) -->
    <div id="tab-me" class="tab-content">
        <button class="me-header-btn" onclick="openPaperModal()">
            <span>Hôm nay bạn thế nào? 📝</span>
            <i class="ri-edit-box-line"></i>
        </button>

        <h4 style="margin-bottom: 12px; color: #475569;">📖 Sổ tay nhật ký dài đã viết</h4>
        <div id="longEntriesList"></div>
    </div>

    <!-- MÀN HÌNH TRANG GIẤY VIẾT NHẬT KÝ DÀI (MODAL SHEET) -->
    <div class="paper-modal" id="paperModal">
        <div class="paper-container">
            <div class="paper-header">
                <h3>📝 Trang Nhật Ký Mới</h3>
                <button class="paper-close-btn" onclick="closePaperModal()"><i class="ri-close-line"></i></button>
            </div>
            
            <div class="paper-body">
                <input type="text" id="longTitleInput" class="paper-title-input" placeholder="Tiêu đề bài viết / 标题...">
                <textarea id="longContentInput" class="paper-content-textarea" placeholder="Viết nhật ký của bạn ở đây... (Hỗ trợ Tiếng Việt & 中文)"></textarea>
                <img id="longImagePreview" alt="Xem trước ảnh đính kèm">
            </div>

            <div class="paper-footer">
                <label class="file-btn">
                    <i class="ri-image-add-line"></i> Thêm ảnh
                    <input type="file" id="longUploadInput" accept="image/*" onchange="handleImageSelect(event, 'longPreview')">
                </label>
                <button class="submit-btn" onclick="saveLongEntry()">Lưu Trang Giấy</button>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH PHÓNG TO ẢNH VÀ TẢI VỀ (LIGHTBOX MODAL) -->
    <div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox(event)">
        <div class="lightbox-toolbar">
            <a id="lightboxDownloadBtn" class="lightbox-btn" download="photo.jpg" title="Tải ảnh về máy" onclick="event.stopPropagation()">
                <i class="ri-download-2-line"></i>
            </a>
            <button class="lightbox-btn" onclick="closeLightbox(event)" title="Đóng">
                <i class="ri-close-line"></i>
            </button>
        </div>
        <div class="lightbox-img-wrapper">
            <img id="lightboxTargetImg" class="lightbox-img" src="" alt="Ảnh phóng to" onclick="event.stopPropagation()">
        </div>
    </div>

    <!-- Thanh điều hướng dưới cùng -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home', this)">
            <i class="ri-home-4-line"></i> Home
        </button>
        <button class="nav-item" onclick="switchTab('journal', this)">
            <i class="ri-booklet-line"></i> Journal
        </button>
        <button class="floating-add-btn" onclick="scrollToInput()">+</button>
        <button class="nav-item" onclick="switchTab('stats', this)">
            <i class="ri-bar-chart-2-line"></i> Stats
        </button>
        <button class="nav-item" onclick="switchTab('me', this)">
            <i class="ri-user-3-line"></i> Me
        </button>
    </div>

</div>

<script>
    let base64Image = "";
    let longBase64Image = "";
    let selectedMoodIcon = "binhthuong.png";
    let currentDateObject = new Date();

    function formatDateKey(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function formatDisplayDate(dateObj) {
        const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        const dayName = days[dateObj.getDay()];
        const day = String(dateObj.getDate()).padStart(2, '0');
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const year = dateObj.getFullYear();
        return `${dayName}, ${day}/${month}/${year}`;
    }

    function updateDateNavigator() {
        const key = formatDateKey(currentDateObject);
        document.getElementById('dateDisplayText').innerText = formatDisplayDate(currentDateObject);
        document.getElementById('datePicker').value = key;
        renderApp();
    }

    function navigateDate(days) {
        currentDateObject.setDate(currentDateObject.getDate() + days);
        updateDateNavigator();
    }

    function onDatePickerChange(val) {
        if (!val) return;
        const parts = val.split('-');
        currentDateObject = new Date(parts[0], parts[1] - 1, parts[2]);
        updateDateNavigator();
    }

    function selectMood(icon, label, element) {
        document.querySelectorAll('.mood-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        selectedMoodIcon = icon;
    }

    function handleImageSelect(event, targetType) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    if (targetType === 'preview') {
                        base64Image = compressedBase64;
                        const preview = document.getElementById('imagePreview');
                        preview.src = base64Image;
                        preview.style.display = 'block';
                    } else if (targetType === 'longPreview') {
                        longBase64Image = compressedBase64;
                        const preview = document.getElementById('longImagePreview');
                        preview.src = longBase64Image;
                        preview.style.display = 'block';
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    // BẬT XEM ẢNH PHÓNG TO VÀ TẢI VỀ
    function openLightbox(imgSrc) {
        const modal = document.getElementById('lightboxModal');
        const targetImg = document.getElementById('lightboxTargetImg');
        const downloadBtn = document.getElementById('lightboxDownloadBtn');

        targetImg.src = imgSrc;
        downloadBtn.href = imgSrc;
        downloadBtn.download = `mochi-photo-${Date.now()}.jpg`;

        modal.classList.add('active');
    }

    function closeLightbox(event) {
        const modal = document.getElementById('lightboxModal');
        modal.classList.remove('active');
    }

    function saveEntry() {
        const text = document.getElementById('diaryInput').value.trim();
        if (!text && !base64Image) {
            alert("Vui lòng nhập nội dung hoặc thêm ảnh!");
            return;
        }

        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const dateKey = formatDateKey(currentDateObject);

        const newEntry = {
            id: Date.now(),
            date: dateKey,
            time: timeStr,
            mood: selectedMoodIcon,
            text: text,
            image: base64Image
        };

        try {
            let entries = JSON.parse(localStorage.getItem('my_diary_entries_mochi') || '[]');
            entries.push(newEntry);
            localStorage.setItem('my_diary_entries_mochi', JSON.stringify(entries));

            document.getElementById('diaryInput').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            base64Image = "";

            renderApp();
        } catch (e) {
            alert("Bộ nhớ tạm đầy, hãy xóa bớt bài viết cũ.");
        }
    }

    function deleteEntry(id) {
        if (confirm("Bạn có chắc muốn xóa dòng trạng thái này?")) {
            let entries = JSON.parse(localStorage.getItem('my_diary_entries_mochi') || '[]');
            entries = entries.filter(item => item.id !== id);
            localStorage.setItem('my_diary_entries_mochi', JSON.stringify(entries));
            renderApp();
        }
    }

    function openPaperModal() {
        document.getElementById('paperModal').classList.add('active');
    }

    function closePaperModal() {
        document.getElementById('paperModal').classList.remove('active');
    }

    function saveLongEntry() {
        const title = document.getElementById('longTitleInput').value.trim();
        const content = document.getElementById('longContentInput').value.trim();

        if (!title && !content) {
            alert("Vui lòng viết tiêu đề hoặc nội dung nhật ký!");
            return;
        }

        const dateKey = formatDateKey(new Date());
        const displayDate = formatDisplayDate(new Date());

        const newLongEntry = {
            id: Date.now(),
            date: dateKey,
            displayDate: displayDate,
            title: title || 'Nhật ký không tiêu đề',
            content: content,
            image: longBase64Image
        };

        try {
            let longEntries = JSON.parse(localStorage.getItem('my_diary_long_entries_mochi') || '[]');
            longEntries.push(newLongEntry);
            localStorage.setItem('my_diary_long_entries_mochi', JSON.stringify(longEntries));

            document.getElementById('longTitleInput').value = '';
            document.getElementById('longContentInput').value = '';
            document.getElementById('longImagePreview').style.display = 'none';
            longBase64Image = "";

            closePaperModal();
            renderApp();
        } catch (e) {
            alert("Bộ nhớ tạm đầy, không thể lưu thêm bài viết dài!");
        }
    }

    function deleteLongEntry(id) {
        if (confirm("Xóa trang nhật ký này?")) {
            let longEntries = JSON.parse(localStorage.getItem('my_diary_long_entries_mochi') || '[]');
            longEntries = longEntries.filter(item => item.id !== id);
            localStorage.setItem('my_diary_long_entries_mochi', JSON.stringify(longEntries));
            renderApp();
        }
    }

    function renderApp() {
        const currentDateKey = formatDateKey(currentDateObject);
        let entries = JSON.parse(localStorage.getItem('my_diary_entries_mochi') || '[]');
        let longEntries = JSON.parse(localStorage.getItem('my_diary_long_entries_mochi') || '[]');
        
        // 1. Timeline
        const timelineList = document.getElementById('timelineList');
        const dayEntries = entries.filter(item => item.date === currentDateKey);
        dayEntries.sort((a, b) => a.time.localeCompare(b.time));

        if (dayEntries.length === 0) {
            timelineList.innerHTML = `<div class="empty-notice">Chưa có nhật ký trong ngày này. Hãy viết ngay bên dưới!</div>`;
        } else {
            timelineList.innerHTML = dayEntries.map(entry => `
                <div class="timeline-item">
                    <div class="timeline-time">${entry.time}</div>
                    <div class="timeline-icon-box">
                        <img src="${entry.mood}" alt="Icon">
                    </div>
                    <div class="timeline-content">
                        <div class="timeline-body-row">
                            <div class="timeline-text">${entry.text}</div>
                            ${entry.image ? `<img src="${entry.image}" class="timeline-img" alt="Ảnh" onclick="openLightbox('${entry.image}')">` : ''}
                        </div>
                        <button class="delete-btn" onclick="deleteEntry(${entry.id})">Xóa</button>
                    </div>
                </div>
            `).join('');
        }

        // 2. Album Ảnh Trong Ngày
        const dayImages = dayEntries.filter(e => e.image).map(e => e.image);
        const galleryCard = document.getElementById('dailyGalleryCard');
        const galleryScroll = document.getElementById('dailyGalleryScroll');

        if (dayImages.length > 0) {
            galleryCard.style.display = 'block';
            galleryScroll.innerHTML = dayImages.map(imgSrc => `<img src="${imgSrc}" class="daily-gallery-img" onclick="openLightbox('${imgSrc}')">`).join('');
        } else {
            galleryCard.style.display = 'none';
        }

        // 3. Tab Journal
        const allEntriesList = document.getElementById('allEntriesList');
        if (entries.length === 0) {
            allEntriesList.innerHTML = `<div class="empty-notice">Chưa có bài viết nào được lưu.</div>`;
        } else {
            allEntriesList.innerHTML = [...entries].reverse().map(entry => `
                <div class="form-card" style="margin-bottom: 12px;">
                    <div style="font-size: 12px; color: #64748b; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">
                        📅 ${entry.date} ⏰ ${entry.time} 
                        <img src="${entry.mood}" style="width: 22px; height: 22px; object-fit: contain;" alt="Icon">
                    </div>
                    <div style="font-size: 14px; color: #334155; margin-bottom: 8px;">${entry.text}</div>
                    ${entry.image ? `<img src="${entry.image}" style="max-width:100\%; height:120px; object-fit:cover; border-radius:8px; cursor:pointer;" alt="Ảnh" onclick="openLightbox('${entry.image}')">` : ''}
                </div>
            `).join('');
        }

        // 4. Tab Me
        const longEntriesList = document.getElementById('longEntriesList');
        if (longEntries.length === 0) {
            longEntriesList.innerHTML = `<div class="empty-notice">Chưa có bài viết dài nào. Bấm nút phía trên để tạo ngay!</div>`;
        } else {
            longEntriesList.innerHTML = [...longEntries].reverse().map(item => `
                <div class="long-entry-card">
                    <div class="long-entry-date">📅 ${item.displayDate || item.date}</div>
                    <div class="long-entry-title">${item.title}</div>
                    <div class="long-entry-text">${item.content}</div>
                    ${item.image ? `<img src="${item.image}" style="max-width:100\%; height:140px; object-fit:cover; border-radius:10px; margin-top:10px; cursor:pointer;" alt="Ảnh" onclick="openLightbox('${item.image}')">` : ''}
                    <button class="delete-btn" style="margin-top:10px;" onclick="deleteLongEntry(${item.id})">Xóa trang này</button>
                </div>
            `).join('');
        }

        document.getElementById('totalCountText').innerText = `Tổng số bài viết đã lưu: ${entries.length + longEntries.length}`;
    }

    function switchTab(tabName, element) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

        document.getElementById(`tab-${tabName}`).classList.add('active');
        if (element) element.classList.add('active');
    }

    function scrollToInput() {
        switchTab('home', document.querySelector('.nav-item'));
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    updateDateNavigator();
</script>

</body>
</html>
